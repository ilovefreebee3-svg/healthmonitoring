- hosts: sk1
  gather_facts: no

  tasks:
#    - name: mspctl debug run
#      ansible.builtin.command: mspctl_debug_run
#    #  ansible.builtin.command: "mspctl debug run"
#      register: input_result
#      changed_when: false

    - name: Mimic 'cat' register output using lookup
      set_fact:
        input_result:
          stdout: "{{ lookup('file', 'mspctl_debug_run.txt') }}"
          stdout_lines: "{{ lookup('file', 'mspctl_debug_run.txt').splitlines() }}"
          rc: 0
          failed: false
          changed: false

    - name: 2A. Display input_result 1
      ansible.builtin.debug:
        msg: "{{ input_result.stdout_lines }}" 

    - name: Initialize variables
      set_fact:
        current_name: ""
        failures: []
        test_results: []

    - name: Parse in ONE loop (correct pairing)
      set_fact:
        current_name: >-
          {{
            item.split(':', 1)[1] | trim
            if item is search('^Test Name:')
            else current_name
          }}

        test_results: >-
          {{
            test_results + [ {'name': current_name, 'status': item.split(':',1)[1] | trim} ]
            if item is search('^STATUS:')
            else test_results
          }}

        failures: >-
          {{
            failures + [ {'name': current_name, 'status': item.split(':',1)[1] | trim} ]
            if (item is search('^STATUS:') and (item.split(':',1)[1] | trim) != 'SUCCESS')
            else failures
          }}

      loop: "{{ input_result.stdout_lines }}"

    - name: Compute summary
      set_fact:
        num_failure: "{{ failures | length }}"
        remark: >-
          {{
            failures
            | map(attribute='name')
            | zip(failures | map(attribute='status'))
            | map('join', ' -> ')
            | join(' -- ')
          }}
        answer: "{{ 'STATUS Not Success' if (failures | length) > 0 else 'STATUS SUCCESS' }}"

    - debug:
        msg:
          - "Failures: {{ num_failure }}"
          - "Remark: {{ remark }}"
          - "Answer: {{ answer }}"

    - name: Append result to CSV (local)
      import_tasks: logd.yml
