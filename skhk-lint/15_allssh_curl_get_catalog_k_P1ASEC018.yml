---
- name: Set variables on an imported playbook
  ansible.builtin.import_playbook: subr.local_init.yml

- name: Run curl -X GET https://P1ASEC018.dcloudsvc.gov.sg:5000/v2/_catalog -k
  hosts: calmcvm
  gather_facts: true
  serial: 1

  vars:
    log_local_enabled: false
    log_ext_enabled: false
    log_splunk_enabled: false
    read_from_file: false
    logd_enabled: false
    role_enabled: false
    log_filesystem_enabled: false
    description: allssh 'curl -X GET https://P1OSISMZ018.ocloudsvc.gov.sg:5000/v2/_catalog -k'
    idx: idx102
    role: r_allssh_curl_get_catalog_k_P1ASEC018
    vpc: tbd

  tasks:
    - name: 1. Set csv_filename
      ansible.builtin.set_fact:
        csv_filename: "{{ hostvars['localhost']['csv_filename'] }}"

    - name: 2. Display csv_filename
      ansible.builtin.debug:
        msg: "{{ hostvars['localhost']['csv_filename'] }}"

    # ------------------------------------------------------------
    # UPFRONT REACHABILITY: Ensures the target control CVM itself is online
    # ------------------------------------------------------------
    - name: 3. Verify connectivity to the Control CVM
      ansible.builtin.wait_for_connection:
        timeout: 5
      register: control_cvm_status
      changed_when: false

    # ------------------------------------------------------------
    # SCENARIO 2: Run curl -X GET https://P1ASEC018.dcloudsvc.gov.sg:5000/v2/_catalog -k
    # ------------------------------------------------------------
    - name: 4. Run "curl -X GET https://P1ASEC018.dcloudsvc.gov.sg:5000/v2/_catalog -k"
      # ansible.builtin.include_tasks: subr.run_allssh.yml
      ansible.builtin.include_tasks: subr.run_allssh_x.yml
      vars:
        target_cmd: "curl -X GET https://P1ASEC018.dcloudsvc.gov.sg:5000/v2/_catalog -k"
      when: not (read_from_file | bool)

    - name: 5. Read from hardcoded file
      ansible.builtin.set_fact:
        input_filter:
          stdout: "{{ lookup('file', 'data.15_allssh_curl_get_catalog_k_P1ASEC018.txt') }}"
          stdout_lines: "{{ lookup('file', 'data.15_allssh_curl_get_catalog_k_P1ASEC018.txt').splitlines() }}"
          rc: 0
          failed: false
          changed: false
      when: read_from_file | bool

    - name: 6. Display input_filter.stdout_lines
      ansible.builtin.debug:
        msg: "{{ input_filter.stdout_lines }}"

    - name: 7. Initialize variables
      ansible.builtin.set_fact:
        remark_list: []
        status_tracker: []
        current_ip: ""
        num_repository: 0
        repository_error_found: false
        remark: []
        answer: ""

    - name: 8. Process input line by line
      ansible.builtin.set_fact:
        # Finalize previous block BEFORE changing IP
        remark: >-
          {{
          remark
          +
          (
          [ current_ip ~ ' - No connection to repository' ] if ( curl_line is match('^=+') and current_ip != '' and (num_repository | int) == 0) else []) }}
        repository_error_found: >-
          {{ true if (curl_line is match('^=+') and current_ip != '' and (num_repository | int) == 0) else repository_error_found }}
        # Update current IP
        current_ip: >-
          {{ (curl_line | regex_replace('^=+', '') | regex_replace('=+$', '') | trim) if curl_line is match('^=+') else current_ip }}
        # Reset or increment counter
        num_repository: >-
          {{ 0 if curl_line is match('^=+') else ((num_repository | int) + 1 if curl_line is search('repositories') else (num_repository | int)) }}
      loop: "{{ input_filter.stdout.split('\n') }}"
      loop_control:
        loop_var: curl_line
      when:
        - curl_line is match('^=+') or curl_line is search('repositories')

    - name: 9. Finalize last block
      ansible.builtin.set_fact:
        remark: >-
          {{
            remark
            +
            (
              [ current_ip ~ ' - No connection to repository' ]
              if (num_repository | int) == 0
              else []
            )
          }}

        repository_error_found: >-
          {{
            true
            if (num_repository | int) == 0
            else repository_error_found
          }}

    - name: 10. Set final answer
      ansible.builtin.set_fact:
        answer: >-
          {{
            'CVM - repository connection error'
            if repository_error_found
            else 'ALL CVMs to repository ok'
          }}

    - name: 11. Show result
      ansible.builtin.debug:
        msg:
          - "remark = {{ remark }}"
          - "answer = {{ answer }}"

    - name: 97. Log to local
      ansible.builtin.import_tasks: subr.log_local.yml
      when: log_local_enabled | bool

    - name: 98. Log to external
      ansible.builtin.import_tasks: subr.log_ext.yml
      when: log_ext_enabled | bool

    - name: 99. Log to Splunk
      ansible.builtin.import_tasks: subr.log_splunk.yml
      when: log_splunk_enabled | bool
