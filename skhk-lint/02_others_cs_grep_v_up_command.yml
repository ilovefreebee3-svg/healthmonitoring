---
- name: Initialize report
  ansible.builtin.import_playbook: subr.local_init.yml

- name: Check CVM cluster status
  hosts: corecvm
  gather_facts: true
  serial: 1
  vars:
    log_local_enabled: false
    log_ext_enabled: false
    log_splunk_enabled: false
    read_from_file: false
    logd_enabled: false
    role_enabled: false
    log_filesystem_enabled: false
    description: "cs | grep -v UP"
    idx: idx059
    role_name: r_cs_grep_v_up
    vpc: tbd
  tasks:
    - name: Setting csv_filename
      ansible.builtin.set_fact:
        csv_filename: "{{ hostvars['localhost']['csv_filename'] }}"

    - name: Display csv_filename
      ansible.builtin.debug:
        msg: "{{ csv_filename }}"

    - name: Declare variables
      ansible.builtin.set_fact:
        down_services: []

    - name: Execute cluster status command
      ansible.builtin.command: /home/nutanix/cluster/bin/cluster status
      register: input_filter
      changed_when: false
      ignore_errors: true
      when: not (read_from_file | bool)

    - name: Read from hardcoded file
      ansible.builtin.set_fact:
        input_filter:
          stdout: "{{ lookup('file', 'data.02_others_cs_grep_v_up_command.txt') }}"
          stdout_lines: "{{ lookup('file', 'data.02_others_cs_grep_v_up_command.txt').splitlines() }}"
          rc: 0
          failed: false
          changed: false
      when: read_from_file | bool

    - name: Display input_filter stdout lines
      ansible.builtin.debug:
        msg: "{{ input_filter.stdout_lines }}"

    - name: Parse output and evaluate status
      ansible.builtin.set_fact:
        down_services: >-
          {%- set lines = input_filter.stdout_lines -%}
          {%- set filtered = [] -%}
          {%- for raw_line in lines -%}
            {%- set line = raw_line.replace(',', ' ') -%}
            {%- if 'CVM:' in line -%}
              {%- set cols = line.split() -%}
              {%- if cols | length >= 3 and cols[2] != 'Up' -%}
                {%- set _ = filtered.append({'ip': cols[1], 'status': cols[2]}) -%}
              {%- endif -%}
            {%- endif -%}
          {%- endfor -%}
          {{ filtered }}

    - name: Set final answer and remark variables
      ansible.builtin.set_fact:
        answer: "{{ 'CVM service(s) down' if down_services | length > 0 else 'CVM service(s) all Up' }}"
        remark: "{{ down_services if down_services | length > 0 else 'All services healthy' }}"

    - name: Display results
      ansible.builtin.debug:
        msg:
          - "Answer: {{ answer }}"
          - "Remark: {{ remark }}"

    - name: 97. Log to local
      ansible.builtin.import_tasks: subr.log_local.yml
      when: log_local_enabled | bool

    - name: 98. Log to external
      ansible.builtin.import_tasks: subr.log_ext.yml
      when: log_ext_enabled | bool

    - name: 99. Log to Splunk
      ansible.builtin.import_tasks: subr.log_splunk.yml
      when: log_splunk_enabled | bool
