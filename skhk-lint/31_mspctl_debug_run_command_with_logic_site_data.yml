---
- name: Set variables on an imported playbook
  ansible.builtin.import_playbook: subr.local_init.yml

- name: How to run mspctl
  hosts: calmcvm
#  hosts: pccvm
  gather_facts: true
  serial: 1

  vars:
    log_local_enabled: false
    log_ext_enabled: false
    log_splunk_enabled: false
    read_from_file: false
    logd_enabled: false
    role_enabled: false
    log_filesystem_enabled: false
    description: mspctl debug run
    idx: idx058
    role: r_mspctl_debug_run
    vpc: tbd

  tasks:
    - name: 1. Set csv_filename
      ansible.builtin.set_fact:
        csv_filename: "{{ hostvars['localhost']['csv_filename'] }}"

    - name: 2. Display csv_filename
      ansible.builtin.debug:
        msg: "{{ hostvars['localhost']['csv_filename'] }}"

    - name: 3. Run mspctl debug with command module
      ansible.builtin.command:
        argv:
          - /bin/bash
          - -c
          - |
            source /etc/profile
            mspctl debug run --log_stdout
      register: input_filter
      changed_when: false
      failed_when: false
      when: not (read_from_file | bool)

    - name: 4. Read from hardcoded file
      ansible.builtin.set_fact:
        input_filter:
          stdout: "{{ lookup('file', 'data.31_mspctl_debug_run_command_with_logic_site_data.txt') }}"
          stdout_lines: "{{ lookup('file', 'data.31_mspctl_debug_run_command_with_logic_site_data.txt').splitlines() }}"
          rc: 0
          failed: false
          changed: false
      when: read_from_file | bool

    - name: 5. Display input_filter.stdout_lines
      ansible.builtin.debug:
        var: input_filter.stdout_lines

    - name: 6. Display the stderr
      ansible.builtin.debug:
        var: input_filter.stderr

    - name: 7. Remove ANSI color codes
      ansible.builtin.set_fact:
        xinput_filter_msg: >-
          {{
            input_filter.stdout_lines
            | map('regex_replace', '\x1B\[[0-9;]*[A-Za-z]', '')
            | list
          }}

    - name: 8. Display cleaned output
      ansible.builtin.debug:
        var: xinput_filter_msg

    - name: 9. Initialize variables
      ansible.builtin.set_fact:
        current_name: ""
        failures: []
        test_results: []

    - name: 9. Parse in ONE loop (correct pairing)
      ansible.builtin.set_fact:
        current_name: >-
          {{
          log_line.split(':', 1)[1] | trim
          if log_line is search('^Test Name:')
          else current_name
          }}
        test_results: >-
          {{
          test_results + [{'name': current_name, 'status': log_line.split(':', 1)[1] | trim}]
          if log_line is search('^STATUS:')
          else test_results
          }}
        failures: >-
          {{
          failures + [{'name': current_name, 'status': log_line.split(':', 1)[1] | trim}]
          if (log_line is search('^STATUS:') and (log_line.split(':', 1)[1] | trim) != 'SUCCESS')
          else failures
          }}
      loop: "{{ xinput_filter_msg }}"
      loop_control:
        loop_var: log_line

    - name: 10. Compute summary
      ansible.builtin.set_fact:
        num_failure: "{{ failures | length }}"
        remark: >-
          {{
            failures
            | map(attribute='name')
            | zip(failures | map(attribute='status'))
            | map('join', ' -> ')
            | join(' -- ')
          }}
        answer: "{{ 'STATUS Not Success' if (failures | length) > 0 else 'STATUS SUCCESS' }}"

    - name: Display remark and answer
      ansible.builtin.debug:
        msg:
          - "Failures: {{ num_failure }}"
          - "Remark: {{ remark }}"
          - "Answer: {{ answer }}"

    - name: 97. Log to local
      ansible.builtin.import_tasks: subr.log_local.yml
      when: log_local_enabled | bool

    - name: 98. Log to external
      ansible.builtin.import_tasks: subr.log_ext.yml
      when: log_ext_enabled | bool

    - name: 99. Log to Splunk
      ansible.builtin.import_tasks: subr.log_splunk.yml
      when: log_splunk_enabled | bool
