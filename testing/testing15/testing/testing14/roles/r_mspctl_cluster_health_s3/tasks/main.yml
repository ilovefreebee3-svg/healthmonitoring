---
- name: 1. Set csv_filename
  ansible.builtin.set_fact:
    csv_filename: "{{ hostvars['localhost']['csv_filename'] }}"

- name: 2. Display csv_filename
  ansible.builtin.debug:
    msg: "{{ hostvars['localhost']['csv_filename'] }}"

- name: 3. Declare variables
  ansible.builtin.set_fact:
    cluster: "S3"
    num_unhealthy: 0
    remark: ""

- name: 4. Run mspctl cluster health s3 with command module
  ansible.builtin.command:
    argv:
      - /bin/bash
      - -c
      - |
        source /etc/profile
        mspctl cluster health {{ cluster }}
  register: input_result
  changed_when: false
  failed_when: false
  when: not (read_from_file | bool)

- name: 5. Mimic 'cat' register output
  ansible.builtin.set_fact:
    input_result:
      stdout: "{{ lookup('file', 'data.34_mspctl_cluster_health_command_s3.txt') }}"
      stdout_lines: "{{ lookup('file', 'data.34_mspctl_cluster_health_command_s3.txt').splitlines() }}"
      stderr: ""
      rc: 0
      failed: false
      changed: false
  when: read_from_file | bool

- name: 6. Display input_result.stdout_lines
  ansible.builtin.debug:
    var: input_result.stdout_lines

- name: 7. Display input_result.stdout
  ansible.builtin.debug:
    var: input_result.stdout

- name: 8. Display input_result.stderr
  ansible.builtin.debug:
    var: input_result.stderr

- name: 9. Display the return code
  ansible.builtin.debug:
    var: input_result.rc

- name: 10. Process each line
  ansible.builtin.set_fact:
    num_unhealthy: "{{ num_unhealthy | int + (1 if healthy | lower != 'true' else 0) }}"
    remark: >-
      {{ remark +
      (component ~ ':' ~ healthy ~ ' ' if healthy | lower != 'true' else '') }}
  loop: "{{ input_result.stdout_lines }}"
  loop_control:
    loop_var: cluster_line
  vars:
    line: "{{ cluster_line | trim }}"
    is_valid: "{{ line != '' and not line.startswith('COMPONENT') }}"
    parsed: "{{ line | regex_findall('^(\\S+)\\s+(\\S+)\\s+(.*)$') }}"
    component: "{{ parsed[0][0] if parsed else '' }}"
    healthy: "{{ parsed[0][1] if parsed else '' }}"
  when: is_valid and parsed | length > 0

- name: 11. Final answer
  ansible.builtin.set_fact:
    answer: "{{ 'Unhealthy' if (num_unhealthy | int) > 0 else 'Healthy' }}"

- name: 12. Show results
  ansible.builtin.debug:
    msg:
      num_unhealthy: "{{ num_unhealthy }}"
      remark: "{{ remark }}"
      answer: "{{ answer }}"

- name: 97. Log to local
  ansible.builtin.import_tasks: subr.log_local.yml
  when: log_local_enabled | bool
