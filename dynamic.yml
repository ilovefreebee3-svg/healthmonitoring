---
- name: Initialize report
  ansible.builtin.import_playbook: subr.role_init.yml

- name: Run roles dynamically
  hosts: engrcvm
  gather_facts: false 
  serial: 1
  tasks:
    - name: 0. Declare variables
      ansible.builtin.set_fact:
        awx_host_ip: "user1@130.8.20.76"
        awx_host_dir: /home/user1/awx_exports/

    - name: 2. Map csv_filename to host
      ansible.builtin.set_fact:
        csv_filename: "{{ hostvars['localhost']['csv_filename'] }}"

    # ... [Your Process host connectivity safely block goes here] ...

#    - name: 3. Simulated  variables
#      ansible.builtin.set_fact:
#        vpc: "VPC"
#        description: "DESCRIPT"
#        idx: "IDX"
#        answer: "ANSWER"
#        remark: "REMARK"


    - name: Append result to CSV
      delegate_to: localhost
      ansible.builtin.lineinfile:
        path: "/tmp/{{ csv_filename }}"
        create: true
        line: "{{ inventory_hostname }}, {{ vpc }}, {{ description }}, {{ idx }}, {{ answer }}, {{ remark }} "
        mode: '0644'

    - name: 98. Log to external
      ansible.builtin.import_tasks: subr.log_ext.yml
      when: log_ext_enabled | bool

  post_tasks:
    - name: 98. Log to external
      ansible.builtin.import_tasks: subr.log_ext.yml
      when: log_ext_enabled | bool
    # NOTE: "99. Log to Splunk" has been completely REMOVED from this entire play

# NEW PLAY: This runs ONLY AFTER all hosts have completely finished writing to the CSV
- name: Finalize and upload master CSV to Splunk
  hosts: localhost
  gather_facts: false
  tasks:
    - name: 99. Log to Splunk
      ansible.builtin.import_tasks: subr.log_splunk.yml
      when: log_splunk_enabled | default(true) | bool

