- name: Capture file content into a variable
  set_fact:
    input_text: "{{ lookup('file', 'allssh_df_kh.txt') }}"

- name: Initialize variables
  set_fact:
    ip_address: ""
    num_over75: 0
    remark: ""

- name: Process lines
  set_fact:
    ip_address: "{{ item.split()[1] if '======' in item else ip_address }}"

    num_over75: >-
      {{ num_over75 | int + 1
         if (
           ('sdb2' in item or 'elastic' in item)
           and (item.split()[4] | regex_replace('%','') | int > 75)
         )
         else num_over75 }}

    remark: >-
      {{ remark +
         (
           ip_address ~ ' ' ~ item.split()[0] ~ ' ' ~ item.split()[4] ~ '  '
           if (
             ('sdb2' in item or 'elastic' in item)
             and (item.split()[4] | regex_replace('%','') | int > 75)
           )
           else ''
         )
      }}
  loop: "{{ input_text.splitlines() }}"

- name: Set final answer
  set_fact:
    answer: "{{ 'All under 75%' if num_over75 == 0 else 'Over 75%' }}"

- name: Show result
  debug:
    msg:
      - "answer: {{ answer }}"
      - "num_over75: {{ num_over75 }}"
      - "remark: {{ remark }}"

- name: Include common role
  ansible.builtin.include_role:
     name: common
