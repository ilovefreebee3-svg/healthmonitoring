---
- import_playbook: subr.report_init.yml

- name: Run roles dynamically
  hosts: allcvms  
  gather_facts: no            # We turn this off at first to prevent dead hosts from crashing the play
  serial: 1

  tasks:
    - name: 1. Display csv_filename
      ansible.builtin.debug:
        msg: "{{ hostvars['localhost']['csv_filename'] }}"

    - name: 2. Display csv_filename
      ansible.builtin.set_fact:
        csv_filename: "{{ hostvars['localhost']['csv_filename'] }}"

    - name: 3. Display csv_filename
      ansible.builtin.debug:
        msg: "{{ hostvars['localhost']['csv_filename'] }}"

    - name: Process host connectivity safely
      block:

        - name: Check network/SSH responsiveness
          ansible.builtin.wait_for_connection:
            timeout: 15

#        - name: Log reachable host status to a local file
#          ansible.builtin.lineinfile:
#            path: "/tmp/unreachable_hosts.log"
#            line: "{{ now(fmt='%Y-%m-%d %H:%M:%S') }} - Host {{ inventory_hostname }} is up or reachable."
#            create: yes
#          delegate_to: localhost

        - name: Gather facts dynamically for live hosts
          ansible.builtin.setup: # This is the manual equivalent of gather_facts: yes

        - name: display csv_filename
          ansible.builtin.debug:
            msg: "{{ csv_filename }}"
   
        - name: Include roles per host
          ansible.builtin.include_role:
            name: "{{ item }}"
          loop: "{{ host_roles }}"

        - name: 98. Log to external
          ansible.builtin.import_tasks: subr.log_ext.yml
          when: log_ext_enabled | bool

        - name: 99. Log to local
          ansible.builtin.import_tasks: subr.log_github.yml
          when: log_github_enabled | bool

      rescue:

        - name: Log unreachable host status to a local file
          ansible.builtin.lineinfile:
            path: "/tmp/unreachable_hosts.log"
            line: "{{ now(fmt='%Y-%m-%d %H:%M:%S') }} - Host {{ inventory_hostname }} is down or unreachable."
            create: yes
          delegate_to: localhost

        - name: Clear host error to move onto the next host in serial queue
          ansible.builtin.meta: clear_host_errors
