---
- name: Parse Custom nvidia-smi Clusters Data Correctly
  hosts: localhost
  gather_facts: false
  vars:
    input_text: |
      ============= 111.222.1.1 ============
      Wed Jan 20 15 02:30:34 2026
      +-----------------------------------------------------------------------------

      | NVIDIA-SMI 535.113.01 Driver Version: 535.113.01 CUDA Version: 12.2 |
      |-------------------------------+----------------------+----------------------+

      | GPU Name Persistence-M| Bus-Id Disp.A | Volatile Uncorr. ECC |
      | Fan Temp Perf Pwr:Usage/Cap| Memory-Usage | GPU-Util Compute M. |
      | | | MIG M. |
      |===============================+======================+======================|
      | 0 NVIDIA A100-SXM... On | 00000000:00:00.0 Off | 0 |
      | N/A 35C P0 60W / 400W | 40009MiB / 40960MiB | 0% Default |
      | | | Disabled |
      +-------------------------------+----------------------+----------------------+

      | 1 NVIDIA A100-SXM... On | 00000000:00:00.0 Off | 0 |
      | N/A 35C P0 60W / 400W | 9950MiB / 40960MiB | 0% Default |
      | | | Disabled |
      +-------------------------------+----------------------+----------------------+
      +-----------------------------------------------------------------------------+

      | Processes: |
      | GPU GI CI PID Type Process name GPU Memory |
      | ID ID Usage |
      |=============================================================================|
      | 0 N/A N/A 17471 C+G v 507MiB |
      | 1 N/A N/A 17649 C+G vgpu 1015MiB |
      +-----------------------------------------------------------------------------+
      ============= 111.222.1.2 ============
      Wed Jan 20 15 02:30:34 2026
      +-----------------------------------------------------------------------------

      | NVIDIA-SMI 535.113.01 Driver Version: 535.113.01 CUDA Version: 12.2 |
      |===============================+======================+======================|
      | 0 NVIDIA A100-SXM... On | 00000000:00:00.0 Off | 0 |
      | N/A 45C P0 60W / 400W | 40009MiB / 40960MiB | 0% Default |
      | | | Disabled |
      +-------------------------------+----------------------+----------------------+

      | 1 NVIDIA A100-SXM... On | 00000000:00:00.0 Off | 0 |
      | N/A 35C P0 60W / 400W | 9950MiB / 40960MiB | 0% Default |
      | | | Disabled |
      +-------------------------------+----------------------+----------------------+
      +-----------------------------------------------------------------------------+

      | Processes: |
      | GPU GI CI PID Type Process name GPU Memory |
      | ID ID Usage |
      |=============================================================================|
      | 0 N/A N/A 17471 C+G v 507MiB |
      | 1 N/A N/A 17649 C+G vgpu 1015MiB |
      ============= 111.222.1.3 ============
      Wed Jan 20 15 02:30:34 2026
      +-----------------------------------------------------------------------------

      | 0 NVIDIA A100-SXM... On | 00000000:00:00.0 Off | 0 |
      | N/A 35C P0 60W / 400W | 40009MiB / 40960MiB | 0% Default |
      | | | Disabled |
      +-------------------------------+----------------------+----------------------+

      | 1 NVIDIA A100-SXM... On | 00000000:00:00.0 Off | 0 |
      | N/A 55C P0 60W / 400W | 9950MiB / 40960MiB | 0% Default |
      | | | Disabled |
      +-------------------------------+----------------------+----------------------+

  tasks:
    - name: Parse lines linearly with completely compressed whitespace profiles
      vars:
        raw_remark: >-
          {% set storage_remarks = [] %}
          {% set temp_remarks = [] %}
          {% set ns = namespace(current_ip='', current_gpu_idx='') %}
          {% set lines = input_text.split('\n') %}
          {% for line in lines %}
            {% set s_line = line | trim %}
            {% if s_line.startswith('===') %}
              {% set ns.current_ip = s_line | replace('=', '') | trim %}
            {% elif 'NVIDIA A100-SXM' in s_line %}
              {% set tokens = s_line.split('|') %}
              {% if tokens | length > 1 %}
                {% set left_tokens = tokens[1].split() %}
                {% if left_tokens | length > 0 %}
                  {% set ns.current_gpu_idx = left_tokens[0] | trim %}
                {% endif %}
              {% endif %}
            {% elif 'MiB /' in s_line and 'C ' in s_line %}
              {% set tokens = s_line.split('|') %}
              {% if tokens | length >= 3 and ns.current_ip != '' and ns.current_gpu_idx != '' %}
                {% set left_side = tokens[1].split() %}
                {% set mid_side = tokens[2].split('/') %}
                {% if left_side | length > 1 and mid_side | length == 2 %}
                  {% set temp_val = left_side[1] | trim %}
                  {% set used_val = mid_side[0] | replace('MiB', '') | trim | float %}
                  {% set total_val = mid_side[1] | replace('MiB', '') | trim | float %}
                  {% set ratio_val = used_val / total_val %}
                  {% set _ = storage_remarks.append({'ip': ns.current_ip, 'gpu_index': ns.current_gpu_idx, 'storage_ratio': ratio_val}) %}
                  {% set _ = temp_remarks.append({'ip': ns.current_ip, 'gpu_index': ns.current_gpu_idx, 'temperature': temp_val}) %}
                {% endif %}
              {% endif %}
            {% endif %}
          {% endfor %}
          {{ (storage_remarks + temp_remarks) | to_json }}
      ansible.builtin.set_fact:
        remark: "{{ raw_remark | from_json }}"

    - name: Evaluate threshold indicators cleanly using compressed lists
      vars:
        raw_answer: >-
          {% if remark | length == 0 %}
            {{ ['None'] | to_json }}
          {% else %}
            {% set ns_ans = namespace(has_storage_nok=false, has_temp_nok=false) %}
            {% for item in remark %}
              {% if item.storage_ratio is defined and item.storage_ratio | float >= 0.9 %}
                {% set ns_ans.has_storage_nok = true %}
              {% endif %}
              {% if item.temperature is defined %}
                {% set item_t = item.temperature | replace('C','') | trim | int %}
                {% if item_t >= 50 %}
                  {% set ns_ans.has_temp_nok = true %}
                {% endif %}
              {% endif %}
            {% endfor %}
            {{ [ (ns_ans.has_storage_nok | ternary('Storage NOK', 'Storage OK')), (ns_ans.has_temp_nok | ternary('Temperature NOK', 'Temperature OK')) ] | to_json }}
          {% endif %}
      ansible.builtin.set_fact:
        answer: "{{ raw_answer | from_json }}"

    - name: Debug verified output profiles
      ansible.builtin.debug:
        msg:
          - "REMARK: {{ remark }}"
          - "ANSWER: {{ answer }}"

