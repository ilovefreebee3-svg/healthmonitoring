---
- name: Export CSV from Container to AWX Host
  hosts: localhost
  gather_facts: true

  vars:
    # The physical IP address or local network domain of your AWX host machine
    awx_host_ip: "130.8.20.99" 
    host_destination_path: "/var/lib/awx/exports/daily_report.csv"

  tasks:
    - name: Set message of the day
      ansible.builtin.copy:
        content: "Welcome to {{ inventory_hostname }}. Managed by Ansible.\n"
        dest: "/tmp/container_report.csv"

    - name: 2a. Force create destination directory structure on the AWX host
      ansible.builtin.command: "mkdir -p /var/lib/awx/exports"
      delegate_to: "{{ awx_host_ip }}"
      become: true # Uses your AWX sudo password

    - name: 2b. Copy file from container to the AWX host filesystem
      ansible.builtin.copy:
        src: "/tmp/container_report.csv"
        dest: "{{ host_destination_path }}"
        mode: '0644'
      delegate_to: "{{ awx_host_ip }}"
      become: true # Uses your AWX sudo password

